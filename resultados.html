<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resultados - Jogo das Emoções</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #F39A45;
            font-family: 'Nunito', sans-serif;
            padding: 30px 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-family: 'Fredoka', sans-serif;
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .card h2 {
            font-family: 'Fredoka', sans-serif;
            margin-top: 0;
        }

        #lista-participantes {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .participante {
            width: 100%;
            border: none;
            border-radius: 15px;
            padding: 18px;
            background: #F8BC72;
            color: white;
            font-family: 'Nunito', sans-serif;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            text-align: left;
        }

        #lista-participantes .participante {
            background: #D87528;
            color: white;
        }

        .participante:hover {
            background: #D87528;
            color: white;
        }

        .participante:active {
    background: #D87528;
    color: white;
}

        #total-participantes {
            font-size: 22px;
            font-weight: 800;
        }

        .resposta {
            margin-bottom: 25px;
        }

        .resposta strong {
            display: block;
            margin-bottom: 8px;
            font-size: 17px;
        }

        .resposta p {
            margin: 0;
            font-size: 16px;
            line-height: 1.5;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Resultados do Jogo das Emoções</h1>

        <div class="card">

            <h2>Total de participantes</h2>

            <div id="total-participantes">
                Carregando...
            </div>

        </div>


        <div class="card">

            <h2>Estatística geral</h2>

            <div id="estatistica-geral">
                Em breve
            </div>

        </div>


        <div class="card">

            <h2>Participantes</h2>

            <div id="lista-participantes">

                <button
                    class="participante"
                    onclick="abrirListaParticipantes()"
                >
                    Acessar respostas
                </button>

            </div>

        </div>

    </div>


<script>

const SUPABASE_URL = "https://kbwdrelckzsdfasslkwk.supabase.co";

const SUPABASE_KEY = "sb_publishable_hsJRPeP6OQAPc8nnp_G_VQ_1LKVffjt";


async function carregarTotalParticipantes() {

    const response =
        await fetch(
            `${SUPABASE_URL}/rest/v1/participantes?select=id,created_at&order=created_at.asc`,
            {
                headers: {
                    "apikey": SUPABASE_KEY
                }
            }
        );


    if (!response.ok) {

        document.getElementById(
            "total-participantes"
        ).textContent =
            "Erro ao carregar.";

        return;

    }


    const participantes =
        await response.json();


    document.getElementById(
        "total-participantes"
    ).textContent =
        participantes.length;

}


async function abrirListaParticipantes() {

    const container =
        document.querySelector(
            ".container"
        );


    container.innerHTML = `

        <h1>
            Participantes
        </h1>

        <div class="card">

            <div id="lista-participantes">
                Carregando...
            </div>

        </div>

    `;


    const response =
        await fetch(
            `${SUPABASE_URL}/rest/v1/participantes?select=id,created_at&order=created_at.asc`,
            {
                headers: {
                    "apikey": SUPABASE_KEY
                }
            }
        );


    if (!response.ok) {

        document.getElementById(
            "lista-participantes"
        ).textContent =
            "Erro ao carregar participantes.";

        return;

    }


    const participantes =
        await response.json();


    const lista =
        document.getElementById(
            "lista-participantes"
        );


    lista.innerHTML = "";


    participantes.forEach(
        function(participante, indice) {

            const botao =
                document.createElement("button");


            botao.className =
                "participante";


            botao.textContent =
                "Participante " +
                (indice + 1);


            botao.onclick =
                function() {

                    abrirPerfil(
                        participante.id,
                        indice + 1
                    );

                };


            lista.appendChild(botao);

        }
    );

}


async function abrirPerfil(
    participanteId,
    numeroParticipante
) {

    const response =
        await fetch(
            `${SUPABASE_URL}/rest/v1/respostas?select=*&participante_id=eq.${participanteId}&order=pergunta_id.asc`,
            {
                headers: {
                    "apikey": SUPABASE_KEY
                }
            }
        );


    if (!response.ok) {

        alert(
            "Erro ao carregar as respostas."
        );

        return;

    }


    const respostas =
        await response.json();


    const container =
        document.querySelector(
            ".container"
        );


    container.innerHTML = `

        <h1>
            Participante ${numeroParticipante}
        </h1>

        <div class="card">

            <h2>Respostas</h2>

            <div id="respostas-participante">
            </div>

        </div>

    `;


    const area =
        document.getElementById(
            "respostas-participante"
        );


    respostas.forEach(
        function(resposta, indice) {

            const bloco =
                document.createElement("div");


            bloco.className =
                "resposta";


            bloco.innerHTML = `

                <strong>
                    Pergunta ${indice + 1}
                </strong>

                <p>
                    ${resposta.resposta || ""}
                </p>

            `;


            area.appendChild(bloco);

        }
    );

}


carregarTotalParticipantes();

</script>

</body>

</html>
