<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resultados - Jogo das Emoções</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #F39A45;
            font-family: 'Nunito', sans-serif;
            padding: 30px 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-family: 'Fredoka', sans-serif;
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .card h2 {
            font-family: 'Fredoka', sans-serif;
            margin-top: 0;
        }

        #lista-participantes {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .participante {
            width: 100%;
            border: none;
            border-radius: 15px;
            padding: 18px;
            background: #F8BC72;
            color: white;
            font-family: 'Nunito', sans-serif;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            text-align: left;
        }

        #lista-participantes .participante {
            background: #D87528;
            color: white;
        }

        .participante:hover {
            background: #D87528;
            color: white;
        }

        .participante:active {
            background: #D87528;
            color: white;
        }

        #total-participantes {
            font-size: 22px;
            font-weight: 800;
        }

        /* Página individual */

        .informacao-participante {
            text-align: center;
            margin-bottom: 30px;
        }

        .informacao-participante h2 {
            margin: 10px 0 5px;
            font-family: 'Fredoka', sans-serif;
            color: white;
            font-size: 20px;
        }

        .informacao-participante p {
            margin: 0 0 20px;
            color: white;
            font-size: 17px;
            font-weight: 600;
        }

        .titulo-estatistica {
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .estatistica-individual {
            color: white;
            font-family: 'Fredoka', sans-serif
            font-size: 17px;
            font-weight: 600;
        }

        .caixa-resposta {
            background: white;
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 18px;
        }

        .caixa-resposta strong {
            display: block;
            color: #D87528;
            font-family: 'Fredoka', sans-serif;
            font-size: 21px;
            margin-bottom: 10px;
        }

        .caixa-resposta p {
            margin: 0;
            color: black;
            font-family: 'Nunito', sans-serif;
            font-size: 16px;
            font-weight: 400;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .botao-voltar {
            display: block;
            width: 100%;
            border: none;
            border-radius: 15px;
            padding: 17px;
            margin-top: 10px;
            margin-bottom: 20px;
            background: #D87528;
            color: white;
            font-family: 'Nunito', sans-serif;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
        }

        .botao-voltar:hover {
            background: #B96525;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Resultados do Jogo das Emoções</h1>

        <div class="card">

            <h2>Total de participantes</h2>

            <div id="total-participantes">
                Carregando...
            </div>

        </div>


        <div class="card">

            <h2>Estatística geral</h2>

            <div id="estatistica-geral">
                Em breve
            </div>

        </div>


        <div class="card">

            <h2>Participantes</h2>

            <div id="lista-participantes">

                <button
                    class="participante"
                    onclick="abrirListaParticipantes()"
                >
                    Acessar respostas
                </button>

            </div>

        </div>

    </div>


<script>

const SUPABASE_URL = "https://kbwdrelckzsdfasslkwk.supabase.co";

const SUPABASE_KEY = "sb_publishable_hsJRPeP6OQAPc8nnp_G_VQ_1LKVffjt";


async function carregarTotalParticipantes() {

    const response =
        await fetch(
            `${SUPABASE_URL}/rest/v1/participantes?select=id,created_at&order=created_at.asc`,
            {
                headers: {
                    "apikey": SUPABASE_KEY
                }
            }
        );


    if (!response.ok) {

        document.getElementById(
            "total-participantes"
        ).textContent =
            "Erro ao carregar.";

        return;

    }


    const participantes =
        await response.json();


    document.getElementById(
        "total-participantes"
    ).textContent =
        participantes.length;

}


async function abrirListaParticipantes() {

    const container =
        document.querySelector(
            ".container"
        );


    container.innerHTML = `

        <h1>
            Participantes
        </h1>

        <div class="card">

            <div id="lista-participantes">
                Carregando...
            </div>

        </div>

<button
class="botao-voltar"
onclick="location.reload()"
>
VOLTAR
</button>

    `;


    const response =
        await fetch(
            `${SUPABASE_URL}/rest/v1/participantes?select=id,created_at&order=created_at.asc`,
            {
                headers: {
                    "apikey": SUPABASE_KEY
                }
            }
        );


    if (!response.ok) {

        document.getElementById(
            "lista-participantes"
        ).textContent =
            "Erro ao carregar participantes.";

        return;

    }


    const participantes =
        await response.json();


    const lista =
        document.getElementById(
            "lista-participantes"
        );


    lista.innerHTML = "";


    participantes.forEach(
        function(participante, indice) {

            const botao =
                document.createElement("button");


            botao.className =
                "participante";


            botao.textContent =
                "Participante " +
                (indice + 1);


            botao.onclick =
                function() {

                    abrirPerfil(
                        participante.id,
                        indice + 1,
                        participante.created_at
                    );

                };


            lista.appendChild(botao);

        }
    );

}


function formatarDataHora(data) {

    const dataFormatada =
        new Date(data);


    return dataFormatada.toLocaleString(
        "pt-BR",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


function escaparHTML(texto) {

    const div =
        document.createElement("div");

    div.textContent =
        texto;

    return div.innerHTML;

}


async function calcularEstatisticaGeral() {

    const response =
        await fetch(
            `${SUPABASE_URL}/rest/v1/respostas?select=pergunta_id,resposta`,
            {
                headers: {
                    "apikey": SUPABASE_KEY
                }
            }
        );


    if (!response.ok) {

        document.getElementById(
            "estatistica-geral"
        ).textContent =
            "Erro ao carregar.";

        return;

    }


    const respostas =
        await response.json();


    const perguntasDeEmocao = [
        1,
        3,
        6,
        7,
        9,
        20
    ];


    const contagem = {};


    respostas.forEach(
        function(resposta) {

            if (
                !perguntasDeEmocao.includes(
                    Number(resposta.pergunta_id)
                )
            ) {
                return;
            }


            const texto =
                resposta.resposta || "";


            const emocoes =
                texto.split(",");


            emocoes.forEach(
                function(emocao) {

                    const nome =
                        emocao.trim();


                    if (!nome) {
                        return;
                    }


                    contagem[nome] =
                        (contagem[nome] || 0) + 1;

                }
            );

        }
    );


    const ranking =
        Object.entries(contagem)
            .sort(
                function(a, b) {
                    return b[1] - a[1];
                }
            )
            .slice(0, 3);


    const resultado =
        ranking.map(
            function(item, indice) {

                const posicao =
                    indice + 1;

                return (
                    posicao +
                    "ª emoção mais escolhida = " +
                    item[0] +
                    " (" +
                    item[1] +
                    " vezes)"
                );

            }
        );


    document.getElementById(
        "estatistica-geral"
    ).innerHTML =
        resultado.join("<br>");

}


async function abrirPerfil(
    participanteId,
    numeroParticipante,
    dataHora
) {

    const response =
        await fetch(
            `${SUPABASE_URL}/rest/v1/respostas?select=id,participante_id,pergunta_id,resposta,detalhe,created_at&participante_id=eq.${participanteId}`,
            {
                method: "GET",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Accept": "application/json"
                }
            }
        );


    if (!response.ok) {

        const erro =
            await response.text();

        alert(
            "Erro ao carregar as respostas: " + erro
        );

        return;

    }


    const respostas =
        await response.json();


    const container =
        document.querySelector(
            ".container"
        );


    const estatistica =
        calcularEstatisticaIndividual(
            respostas
        );


    container.innerHTML = `

        <h1>
            Participante ${numeroParticipante}
        </h1>

        <div class="informacao-participante">

            <h2>
                DATA E HORA
            </h2>

            <p>
                ${formatarDataHora(dataHora)}
            </p>

            <div class="titulo-estatistica">
                ESTATÍSTICA INDIVIDUAL
            </div>

            <div class="estatistica-individual">
                ${escaparHTML(estatistica)}
            </div>

        </div>

        <div id="respostas-participante">
        </div>

        <button
            class="botao-voltar"
            onclick="abrirListaParticipantes()"
        >
            VOLTAR
        </button>

    `;


    const area =
        document.getElementById(
            "respostas-participante"
        );


    if (respostas.length === 0) {

        area.innerHTML = `
            <div class="caixa-resposta">
                <p>Nenhuma resposta encontrada.</p>
            </div>
        `;

        return;
    }


    respostas.forEach(
        function(resposta, indice) {

            const bloco =
                document.createElement("div");


            bloco.className =
                "caixa-resposta";


            const textoResposta =
                resposta.resposta || "";


            const detalhe =
                resposta.detalhe || "";


            let textoCompleto =
                textoResposta;


            if (detalhe) {

                textoCompleto +=
                    "\n" + detalhe;

            }


            bloco.innerHTML = `

                <strong>
                    RESPOSTA ${indice + 1}
                </strong>

                <p>
                    ${escaparHTML(textoCompleto)}
                </p>

            `;


            area.appendChild(bloco);

        }
    );

}


carregarTotalParticipantes();
calcularEstatisticaGeral();

</script>

</body>

</html>
