<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resultados - Jogo das Emoções</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #F39A45;
            font-family: 'Nunito', sans-serif;
            padding: 30px 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-family: 'Fredoka', sans-serif;
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .card h2 {
            font-family: 'Fredoka', sans-serif;
            margin-top: 0;
        }

        #lista-participantes {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .participante {
            width: 100%;
            border: none;
            border-radius: 15px;
            padding: 18px;
            background: #F8BC72;
            font-family: 'Nunito', sans-serif;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            text-align: left;
        }

        .participante:hover {
            background: #D87528;
            color: white;
        }

        #total-participantes {
            font-size: 22px;
            font-weight: 800;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Resultados do Jogo das Emoções</h1>

        <div class="card">

            <h2>Total de participantes</h2>

            <div id="total-participantes">
                Carregando...
            </div>

        </div>


        <div class="card">

            <h2>Estatística geral</h2>

            <div id="estatistica-geral">
                Em breve
            </div>

        </div>


        <div class="card">

            <h2>Participantes</h2>

            <div id="lista-participantes">
                Carregando...
            </div>

        </div>

    </div>

</body>

    <script>

const SUPABASE_URL = "https://kbwdrelckzsdfasslkwk.supabase.co";
const SUPABASE_KEY = "sb_publishable_hsJRPeP6OQAPc8nnp_G_VQ_1LKVffjt";

async function carregarParticipantes() {

    const response = await fetch(
        `${SUPABASE_URL}/rest/v1/participantes?select=id,created_at&order=created_at.asc`,
        {
            headers: {
                "apikey": SUPABASE_KEY
            }
        }
    );

    if (!response.ok) {
        document.getElementById("lista-participantes").textContent =
            "Erro ao carregar participantes.";
        return;
    }

    const participantes = await response.json();

    document.getElementById("total-participantes").textContent =
        participantes.length;

    const lista =
        document.getElementById("lista-participantes");

    lista.innerHTML = "";

    participantes.forEach(function(participante, indice) {

        const botao = document.createElement("button");

        botao.className = "participante";

        botao.textContent =
            "Participante " + (indice + 1);

        lista.appendChild(botao);

    });

}

carregarParticipantes();

</script>

</html>
