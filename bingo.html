<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bingo das Emoções</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: #ed8b27;
    font-family: 'Fredoka', sans-serif;
    color: white;
    padding: 14px 16px;
}

main {
    width: 100%;
    max-width: 650px;
    height: 100%;
    margin: 0 auto;

    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: auto auto auto minmax(0, 30%);
    align-content: space-between;

    justify-items: center;
    text-align: center;
}

h1 {
    width: 100%;
    font-size: clamp(27px, 7vw, 42px);
    font-weight: 700;
    letter-spacing: 1px;
    margin: 0;
}

.caixa-sorteio {
    background: white;
    color: #222;
    width: 100%;
    min-height: 145px;
    border-radius: 18px;
    padding: 22px 16px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    box-shadow: 0 5px 12px #00000020;
}

.palavra {
    font-size: clamp(27px, 7vw, 42px);
    font-weight: 700;
    overflow-wrap: anywhere;
}

.explicacao {
    margin-top: 15px;
    max-width: 480px;
    font-size: 16px;
    line-height: 1.4;
}

.explicacao strong {
    display: block;
    margin-bottom: 5px;
    font-weight: 600;
}

.explicacao p {
    margin: 0;
}

.escondido {
    display: none;
}

.botoes {
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 12px;
}

button {
    font-family: 'Fredoka', sans-serif;
    border: none;
    border-radius: 12px;
    padding: 13px 20px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, opacity 0.2s;
}

#sortear {
    background: #b95612;
    color: white;
    flex: 1;
    max-width: 230px;
}

#reiniciar {
    background: #d16d1b;
    color: white;
    border: 2px solid white;
    flex: 1;
    max-width: 180px;
}

button:disabled {
    opacity: 0.55;
    cursor: not-allowed;
}

button:not(:disabled):active {
    transform: scale(0.96);
}

.historico {
    width: 100%;
    min-height: 0;
    display: flex;
    flex-direction: column;
    text-align: center;
    overflow: hidden;
}

h2 {
    flex-shrink: 0;
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 12px;
}

.lista-chamadas {
    flex: 1;
    min-height: 0;

    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-content: flex-start;
    gap: 9px;

    overflow-y: auto;
    padding: 4px 3px 10px;

    scrollbar-width: thin;
    scrollbar-color: #bd641c transparent;
    overscroll-behavior: contain;
}

.palavra-chamada {
    color: white;
    background: #bd641c;
    padding: 9px 13px;
    border-radius: 9px;
    font-size: 16px;
    font-weight: 500;
}

.nenhuma {
    font-size: 16px;
    opacity: 0.9;
    margin: 10px 0;
}

/* JANELA DE CONFIRMAÇÃO */

.modal {
    position: fixed;
    inset: 0;
    background: #00000080;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 10;
}

.modal.escondido {
    display: none;
}

.modal-conteudo {
    background: white;
    color: #222;
    width: 100%;
    max-width: 360px;
    padding: 26px 20px;
    border-radius: 18px;
    text-align: center;
}

.modal-conteudo h2 {
    margin: 0 0 12px;
}

.modal-conteudo p {
    line-height: 1.5;
}

.confirmacao {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 20px;
}

.sim {
    background: #b95612;
    color: white;
}

.nao {
    background: #e8e8e8;
    color: #222;
}

/* CELULARES */

@media (max-width: 400px) {
    body {
        padding: 12px 13px;
    }

    h1 {
        font-size: 29px;
    }

    .caixa-sorteio {
        min-height: 135px;
        padding: 19px 13px;
        border-radius: 16px;
    }

    .palavra {
        font-size: 29px;
    }

    .explicacao {
        font-size: 15px;
        margin-top: 12px;
    }

    button {
        padding: 12px 9px;
        font-size: 16px;
    }

    h2 {
        font-size: 20px;
    }

    .palavra-chamada {
        font-size: 15px;
        padding: 8px 11px;
    }
}

/* CELULARES COM POUCA ALTURA */

@media (max-height: 650px) {
    body {
        padding-top: 8px;
        padding-bottom: 8px;
    }

    .caixa-sorteio {
        min-height: 110px;
        padding: 12px;
    }

    button {
        padding: 10px 12px;
    }

    h2 {
        font-size: 18px;
        margin-bottom: 8px;
    }

    .palavra-chamada {
        padding: 6px 9px;
        font-size: 14px;
    }
}
</style>
</head>

<body>

<main>

    <h1>BINGO DAS EMOÇÕES</h1>

    <section class="caixa-sorteio">

        <div class="palavra" id="palavra">
            Toque em sortear
        </div>

        <div class="explicacao escondido" id="explicacao">
            <strong>O que significa?</strong>
            <p id="textoExplicacao"></p>
        </div>

    </section>

    <div class="botoes">

        <button id="sortear" type="button">
            SORTEAR
        </button>

        <button id="reiniciar" type="button">
            REINICIAR
        </button>

    </div>

    <section class="historico">

        <h2>PALAVRAS JÁ CHAMADAS</h2>

        <div class="lista-chamadas" id="listaChamadas">
            <p class="nenhuma">Nenhuma palavra foi chamada ainda.</p>
        </div>

    </section>

</main>

<!-- CONFIRMAÇÃO PARA REINICIAR -->

<div class="modal escondido" id="modal">

    <div class="modal-conteudo">

        <h2>Você quer reiniciar?</h2>

        <p>Todas as palavras já sorteadas serão apagadas.</p>

        <div class="confirmacao">

            <button class="sim" id="botaoSim" type="button">
                SIM
            </button>

            <button class="nao" id="botaoNao" type="button">
                NÃO
            </button>

        </div>

    </div>

</div>

<script>

// LISTA DE PALAVRAS

const palavras = [
    "Alegria",
    "Amor",
    "Afeto",
    "Carinho",
    "Felicidade",
    "Euforia",
    "Empolgação",
    "Entusiasmo",
    "Prazer",
    "Gratidão",
    "Esperança",
    "Alívio",
    "Orgulho",
    "Confiança",
    "Coragem",
    "Calma",
    "Paz",
    "Serenidade",
    "Tranquilidade",
    "Segurança",
    "Admiração",
    "Encanto",
    "Fascínio",
    "Diversão",
    "Humor",
    "Satisfação",
    "Realização",
    "Motivação",
    "Inspiração",
    "Otimismo",
    "Curiosidade",
    "Interesse",
    "Surpresa",
    "Ternura",
    "Compaixão",
    "Empatia",
    "Acolhimento",
    "Pertencimento",
    "Liberdade",
    "Deslumbramento",
    "Descontração",
    "Vivacidade",
    "Animação",
    "Deleite",
    "Respeito",
    "Simpatia",
    "Completude",
    "Tristeza",
    "Medo",
    "Raiva",
    "Ódio",
    "Nojo",
    "Aversão",
    "Ansiedade",
    "Angústia",
    "Aflição",
    "Pânico",
    "Terror",
    "Horror",
    "Irritação",
    "Frustração",
    "Decepção",
    "Culpa",
    "Vergonha",
    "Remorso",
    "Arrependimento",
    "Inveja",
    "Ciúme",
    "Desprezo",
    "Desgosto",
    "Desânimo",
    "Tédio",
    "Apatia",
    "Solidão",
    "Saudade",
    "Desamparo",
    "Desespero",
    "Desconfiança",
    "Insegurança",
    "Vulnerabilidade",
    "Impotência",
    "Humilhação",
    "Rejeição",
    "Ressentimento",
    "Amargura",
    "Mágoa",
    "Rancor",
    "Hostilidade",
    "Impaciência",
    "Agonia",
    "Pesar",
    "Melancolia",
    "Desconforto",
    "Preocupação",
    "Desilusão",
    "Desapontamento",
    "Nostalgia",
    "Expectativa",
    "Dúvida",
    "Confusão",
    "Espanto",
    "Incerteza",
    "Estranheza",
    "Hesitação",
    "Indignação",
    "Inquietação",
    "Excitação",
    "Agitação",
    "Tensão",
    "Alerta",
    "Resignação",
    "Aceitação",
    "Determinação",
    "Acanhamento",
    "Afabilidade",
    "Alvoroço",
    "Animosidade",
    "Antipatia",
    "Apreço",
    "Ardor",
    "Atordoamento",
    "Desconsolo",
    "Devoção",
    "Fervor",
    "Frenesi",
    "Repugnância",
    "Zanga",
    "Júbilo"
];

// EXPLICAÇÕES

const explicacoes = {

    "Ternura":
        "Sentimento de carinho, delicadeza e afeto por alguém ou alguma coisa.",

    "Deslumbramento":
        "Sensação de encantamento intenso diante de algo que impressiona ou fascina.",

    "Vivacidade":
        "Estado de energia, entusiasmo e disposição para viver e participar das experiências.",

    "Deleite":
        "Sensação de grande prazer e satisfação diante de algo agradável.",

    "Completude":
        "Sensação de plenitude, como se algo estivesse completo ou realizado.",

    "Aversão":
        "Sentimento de forte rejeição ou repulsa em relação a algo ou alguém.",

    "Apatia":
        "Estado de falta de interesse, entusiasmo ou reação emocional.",

    "Impotência":
        "Sensação de não conseguir agir ou mudar uma situação, mesmo desejando fazê-lo.",

    "Amargura":
        "Sentimento persistente de tristeza, mágoa ou ressentimento.",

    "Hostilidade":
        "Atitude ou sentimento de oposição, agressividade ou antipatia em relação a alguém.",

    "Pesar":
        "Sentimento de tristeza ou sofrimento diante de uma perda ou situação difícil.",

    "Afabilidade":
        "Qualidade de quem demonstra gentileza, simpatia e cordialidade.",

    "Alvoroço":
        "Estado de grande agitação, movimentação ou excitação.",

    "Animosidade":
        "Sentimento de antipatia ou hostilidade em relação a alguém.",

    "Frenesi":
        "Estado de agitação, entusiasmo ou excitação muito intensos.",

    "Zanga":
        "Sentimento de irritação ou raiva diante de algo desagradável.",

    "Repugnância":
        "Sensação intensa de aversão ou repulsa diante de algo.",

    "Júbilo":
        "Sentimento de alegria intensa, entusiasmo e grande satisfação."

};

// ELEMENTOS DA TELA

const elementoPalavra = document.getElementById("palavra");
const elementoExplicacao = document.getElementById("explicacao");
const textoExplicacao = document.getElementById("textoExplicacao");
const listaChamadas = document.getElementById("listaChamadas");
const botaoSortear = document.getElementById("sortear");
const botaoReiniciar = document.getElementById("reiniciar");
const modal = document.getElementById("modal");

let disponiveis = [...palavras];
let chamadas = [];
let sorteando = false;

// HISTÓRICO

function atualizarHistorico() {

    listaChamadas.innerHTML = "";

    if (chamadas.length === 0) {

        listaChamadas.innerHTML =
            '<p class="nenhuma">Nenhuma palavra foi chamada ainda.</p>';

        return;
    }

    chamadas.forEach(palavra => {

        const item = document.createElement("span");

        item.className = "palavra-chamada";
        item.textContent = palavra;

        listaChamadas.appendChild(item);

    });

}

// MOSTRAR RESULTADO

function mostrarResultado(palavra) {

    elementoPalavra.textContent = palavra;

    if (explicacoes[palavra]) {

        textoExplicacao.textContent = explicacoes[palavra];
        elementoExplicacao.classList.remove("escondido");

    } else {

        elementoExplicacao.classList.add("escondido");
        textoExplicacao.textContent = "";

    }

}

// SORTEIO

function sortearPalavra() {

    if (sorteando || disponiveis.length === 0) {
        return;
    }

    sorteando = true;
    botaoSortear.disabled = true;

    elementoExplicacao.classList.add("escondido");

    const indiceFinal = Math.floor(
        Math.random() * disponiveis.length
    );

    const resultado = disponiveis[indiceFinal];

    const inicio = Date.now();
    const duracao = 2500;

    function animacao() {

        const tempoDecorrido = Date.now() - inicio;

        const indiceAnimacao = Math.floor(
            Math.random() * disponiveis.length
        );

        elementoPalavra.textContent =
            disponiveis[indiceAnimacao];

        if (tempoDecorrido < duracao) {

            setTimeout(animacao, 75);

        } else {

            finalizarSorteio(resultado, indiceFinal);

        }

    }

    animacao();

}

// FINALIZAR SORTEIO

function finalizarSorteio(resultado, indiceFinal) {

    mostrarResultado(resultado);

    chamadas.push(resultado);

    disponiveis.splice(indiceFinal, 1);

    atualizarHistorico();

    sorteando = false;

    if (disponiveis.length === 0) {

        botaoSortear.textContent = "FIM DO SORTEIO";
        botaoSortear.disabled = true;

    } else {

        botaoSortear.disabled = false;

    }

}

// ABRIR CONFIRMAÇÃO

function abrirConfirmacao() {

    if (sorteando) return;

    modal.classList.remove("escondido");

}

// FECHAR CONFIRMAÇÃO

function fecharConfirmacao() {

    modal.classList.add("escondido");

}

// REINICIAR

function confirmarReinicio() {

    disponiveis = [...palavras];
    chamadas = [];
    sorteando = false;

    elementoPalavra.textContent = "Toque em sortear";

    elementoExplicacao.classList.add("escondido");
    textoExplicacao.textContent = "";

    botaoSortear.disabled = false;
    botaoSortear.textContent = "SORTEAR";

    atualizarHistorico();

    fecharConfirmacao();

}

// EVENTOS DOS BOTÕES

botaoSortear.addEventListener("click", sortearPalavra);

botaoReiniciar.addEventListener("click", abrirConfirmacao);

document.getElementById("botaoSim")
    .addEventListener("click", confirmarReinicio);

document.getElementById("botaoNao")
    .addEventListener("click", fecharConfirmacao);

</script>

</body>
</html>
